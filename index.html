<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イラストギャラリー</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    line-height: 1.6;
  }
  header {
    padding: 60px 20px 30px;
    text-align: center;
    background: linear-gradient(180deg, #1a1a2e 0%, #0f0f0f 100%);
  }
  header h1 {
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #fff;
  }
  header p {
    color: #888;
    margin-top: 6px;
    font-size: 0.95rem;
  }
  .gallery {
    column-count: 3;
    column-gap: 16px;
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 20px 80px;
  }
  .gallery-item {
    break-inside: avoid;
    margin-bottom: 16px;
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    background: #1a1a1a;
  }
  .gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .gallery-item img {
    width: 100%;
    display: block;
    transition: opacity 0.3s ease;
  }
  .gallery-item .caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 40px 14px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    color: #fff;
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .gallery-item:hover .caption {
    opacity: 1;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 40px;
  }
  .lightbox.active {
    display: flex;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }
  .lightbox .lb-caption {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.9rem;
  }
  .lightbox .lb-counter {
    position: fixed;
    bottom: 30px;
    color: #666;
    font-size: 0.85rem;
  }
  .lightbox .close,
  .lightbox .prev,
  .lightbox .next {
    position: fixed;
    background: rgba(255,255,255,0.06);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .lightbox .close:hover,
  .lightbox .prev:hover,
  .lightbox .next:hover {
    background: rgba(255,255,255,0.15);
  }
  .lightbox .close {
    top: 20px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.6rem;
  }
  .lightbox .prev,
  .lightbox .next {
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 1.8rem;
  }
  .lightbox .prev { left: 20px; }
  .lightbox .next { right: 20px; }

  @media (max-width: 900px) {
    .gallery { column-count: 2; }
  }
  @media (max-width: 500px) {
    .gallery { column-count: 1; }
    header h1 { font-size: 1.6rem; }
    .lightbox { padding: 16px; }
    .lightbox .prev { left: 8px; width: 40px; height: 40px; }
    .lightbox .next { right: 8px; width: 40px; height: 40px; }
  }
</style>
</head>
<body>
<header>
  <h1>イラストギャラリー</h1>
  <p>イラストレーション作品集</p>
</header>
<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose">&times;</button>
  <button class="prev" id="lbPrev">&#8249;</button>
  <button class="next" id="lbNext">&#8250;</button>
  <img id="lbImage" src="" alt="">
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
const imageFiles = [
  { src: "ChatGPT Image Jul 8, 2026, 09_18_20 AM.png", alt: "Illustration 01" },
  { src: "ChatGPT Image Jul 8, 2026, 09_18_28 AM.png", alt: "Illustration 02" },
  { src: "ChatGPT Image Jul 8, 2026, 09_18_39 AM.png", alt: "Illustration 03" },
  { src: "ChatGPT Image Jul 8, 2026, 09_18_57 AM.png", alt: "Illustration 04" },
  { src: "ChatGPT Image Jul 8, 2026, 09_19_08 AM.png", alt: "Illustration 05" },
  { src: "ChatGPT Image Jul 8, 2026, 09_19_26 AM.png", alt: "Illustration 06" },
  { src: "ChatGPT Image Jul 8, 2026, 09_19_33 AM.png", alt: "Illustration 07" },
  { src: "ChatGPT Image Jul 8, 2026, 09_20_13 AM.png", alt: "Illustration 08" },
  { src: "ChatGPT Image Jul 8, 2026, 09_20_22 AM.png", alt: "Illustration 09" },
  { src: "ChatGPT Image Jul 8, 2026, 09_20_28 AM.png", alt: "Illustration 10" },
  { src: "ChatGPT Image Jul 8, 2026, 09_20_38 AM.png", alt: "Illustration 11" },
  { src: "ChatGPT Image Jul 8, 2026, 09_20_45 AM.png", alt: "Illustration 12" },
  { src: "ChatGPT Image Jul 9, 2026, 12_03_34 AM.png", alt: "Illustration 13" },
  { src: "ChatGPT Image Jul 9, 2026, 12_03_44 AM.png", alt: "Illustration 14" },
  { src: "ChatGPT Image Jul 9, 2026, 12_03_57 AM.png", alt: "Illustration 15" },
];

const gallery = document.getElementById('gallery');
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImage');
const lbCaption = document.getElementById('lbCaption');
const lbCounter = document.getElementById('lbCounter');
let currentIndex = 0;

function renderGallery() {
  gallery.innerHTML = '';
  imageFiles.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.innerHTML = `<img src="${img.src}" alt="${img.alt}" loading="lazy"><div class="caption">${img.alt}</div>`;
    div.addEventListener('click', () => openLightbox(i));
    gallery.appendChild(div);
  });
}

function openLightbox(index) {
  currentIndex = index;
  updateLightbox();
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  const img = imageFiles[currentIndex];
  lbImg.src = img.src;
  lbImg.alt = img.alt;
  lbCaption.textContent = img.alt;
  lbCounter.textContent = `${currentIndex + 1} / ${imageFiles.length}`;
}

function closeLightbox() {
  lb.classList.remove('active');
  document.body.style.overflow = '';
}

function prevImage() {
  currentIndex = (currentIndex - 1 + imageFiles.length) % imageFiles.length;
  updateLightbox();
}

function nextImage() {
  currentIndex = (currentIndex + 1) % imageFiles.length;
  updateLightbox();
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', prevImage);
document.getElementById('lbNext').addEventListener('click', nextImage);

document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') prevImage();
  if (e.key === 'ArrowRight') nextImage();
});

lb.addEventListener('click', (e) => {
  if (e.target === lb) closeLightbox();
});

renderGallery();
</script>
</body>
</html>
